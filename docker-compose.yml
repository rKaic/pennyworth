version: "3.9"
services:
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
  pennyworth:
    environment:
      - PENNYWORTH_REPO_CONNECTION_STRING
    build: .
    ports:
      - "3000"
      - "9001"
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pennyworth
    ports:
      - "3000:3000"
      - "9001:9001"
volumes:
  mongo_data: